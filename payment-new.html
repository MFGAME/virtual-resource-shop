<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付验证 - AI资源商店</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h2 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }
        .payment-codes {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }
        .payment-code {
            text-align: center;
        }
        .payment-code img {
            width: 200px;
            height: 200px;
            border-radius: 10px;
            border: 2px solid #eee;
        }
        .payment-code p {
            margin-top: 10px;
            font-weight: bold;
            color: #666;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 16px;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .submit-btn:hover {
            transform: scale(1.02);
        }
        .note {
            background: #fff3cd;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            color: #856404;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .product-info {
            background: #f0f0ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #667eea;
            font-weight: bold;
            text-align: center;
        }
        .success-message {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
        }
        .file-upload {
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .file-upload:hover {
            background: #f0f0ff;
        }
        .file-upload input {
            display: none;
        }
        .preview-image {
            max-width: 100%;
            max-height: 300px;
            margin-top: 15px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>💳 完成支付</h2>

        <div class="product-info" id="productInfo">
            <!-- 动态填充商品信息 -->
        </div>

        <p style="margin-bottom: 20px; color: #666; text-align: center;">
            请使用微信或支付宝扫码支付
        </p>

        <div class="payment-codes">
            <div class="payment-code">
                <img src="../assets/payment-codes/code1.jpg" alt="微信支付">
                <p>微信支付</p>
            </div>
            <div class="payment-code">
                <img src="../assets/payment-codes/code2.jpg" alt="支付宝">
                <p>支付宝</p>
            </div>
        </div>

        <div class="note">
            <strong>⚠️ 支付说明：</strong><br>
            1. 扫码支付对应金额<br>
            2. <strong style="color: #d9534f;">上传支付截图（必须）</strong><br>
            3. 填写邮箱地址<br>
            4. 提交后等待审核（通常1小时内）
        </div>

        <form id="orderForm" style="margin-top: 30px;">
            <div class="form-group">
                <label>你选择的商品：</label>
                <select id="productSelect" required>
                    <option value="chatgpt">ChatGPT Prompt合集 - ¥29.9</option>
                    <option value="midjourney">Midjourney Prompt合集 - ¥39.9</option>
                    <option value="combo">超级组合套餐 - ¥59.9</option>
                </select>
            </div>

            <div class="form-group">
                <label>支付截图：<span style="color: #d9534f;">*</span></label>
                <div class="file-upload" id="fileUpload">
                    <input type="file" id="paymentScreenshot" accept="image/*">
                    <p>📷 点击上传支付截图</p>
                    <p style="font-size: 12px; color: #999; margin-top: 10px;">支持 JPG, PNG 格式</p>
                    <img id="previewImage" class="preview-image" style="display: none;">
                </div>
            </div>

            <div class="form-group">
                <label>你的邮箱：</label>
                <input type="email" id="email" placeholder="example@email.com" required>
            </div>

            <div class="form-group">
                <label>支付方式：</label>
                <select id="paymentMethod" required>
                    <option value="wechat">微信支付</option>
                    <option value="alipay">支付宝</option>
                </select>
            </div>

            <div class="form-group">
                <label>备注（可选）：</label>
                <textarea id="notes" rows="2" placeholder="有什么需要说明的..."></textarea>
            </div>

            <button type="submit" class="submit-btn">✓ 提交订单</button>
        </form>

        <div class="success-message" id="successMessage">
            <h3 style="margin-bottom: 15px;">✅ 订单提交成功！</h3>
            <p>订单号：<strong id="orderId"></strong></p>
            <p style="margin-top: 10px;">我们会在<strong>1小时内</strong>审核并通过邮件发送下载链接</p>
            <p style="margin-top: 10px; font-size: 14px; color: #666;">请保存订单号，方便查询</p>
        </div>
    </div>

    <script>
        // 产品配置
        const products = {
            'chatgpt': {
                name: 'ChatGPT Prompt合集',
                price: '29.9',
                downloadUrl: 'https://mfgame.github.io/virtual-resource-shop/download.html#chatgpt'
            },
            'midjourney': {
                name: 'Midjourney Prompt合集',
                price: '39.9',
                downloadUrl: 'https://mfgame.github.io/virtual-resource-shop/download.html#midjourney'
            },
            'combo': {
                name: '超级组合套餐',
                price: '59.9',
                downloadUrl: 'https://mfgame.github.io/virtual-resource-shop/download.html'
            }
        };

        // 从URL参数获取商品信息
        const urlParams = new URLSearchParams(window.location.search);
        const product = urlParams.get('product');
        if (product && products[product]) {
            document.getElementById('productSelect').value = product;
            updateProductInfo();
        }

        function updateProductInfo() {
            const select = document.getElementById('productSelect');
            const info = document.getElementById('productInfo');
            const selectedProduct = products[select.value];
            info.textContent = `${selectedProduct.name} - ¥${selectedProduct.price}`;
        }

        document.getElementById('productSelect').addEventListener('change', updateProductInfo);
        updateProductInfo();

        // 文件上传预览
        document.getElementById('paymentScreenshot').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('previewImage');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    document.getElementById('fileUpload').querySelector('p').textContent = '✅ 已选择文件';
                }
                reader.readAsDataURL(file);
            }
        });

        // 表单提交
        document.getElementById('orderForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const productKey = document.getElementById('productSelect').value;
            const email = document.getElementById('email').value;
            const paymentMethod = document.getElementById('paymentMethod').value;
            const notes = document.getElementById('notes').value;
            const screenshotInput = document.getElementById('paymentScreenshot');

            if (!screenshotInput.files[0]) {
                alert('请上传支付截图');
                return;
            }

            const file = screenshotInput.files[0];
            const reader = new FileReader();

            reader.onload = async function(e) {
                const product = products[productKey];

                try {
                    // 提交订单
                    const orderId = Date.now().toString(36) + Math.random().toString(36).substr(2, 5);

                    const order = {
                        id: orderId,
                        product: product.name,
                        price: product.price,
                        email: email,
                        paymentMethod: paymentMethod,
                        notes: notes,
                        paymentScreenshot: e.target.result, // base64图片
                        status: 'pending',
                        createdAt: new Date().toISOString()
                    };

                    // 保存到localStorage
                    let orders = JSON.parse(localStorage.getItem('orders') || '[]');
                    orders.push(order);
                    localStorage.setItem('orders', JSON.stringify(orders));

                    // 显示成功消息
                    document.getElementById('orderForm').style.display = 'none';
                    document.getElementById('successMessage').style.display = 'block';
                    document.getElementById('orderId').textContent = orderId;

                } catch (error) {
                    console.error('提交订单失败:', error);
                    alert('提交失败，请检查网络连接');
                }
            };

            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
