<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付成功 - AI资源商店</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h2 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }
        .payment-codes {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }
        .payment-code {
            text-align: center;
        }
        .payment-code img {
            width: 200px;
            height: 200px;
            border-radius: 10px;
            border: 2px solid #eee;
        }
        .payment-code p {
            margin-top: 10px;
            font-weight: bold;
            color: #666;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 16px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .submit-btn:hover {
            transform: scale(1.02);
        }
        .note {
            background: #fff3cd;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            color: #856404;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .product-info {
            background: #f0f0ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #667eea;
            font-weight: bold;
            text-align: center;
        }
        .success-message {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>💳 完成支付</h2>

        <div class="product-info" id="productInfo">
            <!-- 动态填充商品信息 -->
        </div>

        <p style="margin-bottom: 20px; color: #666; text-align: center;">
            请使用微信或支付宝扫码支付
        </p>

        <div class="payment-codes">
            <div class="payment-code">
                <img src="assets/payment-codes/code1.jpg" alt="微信支付">
                <p>微信支付</p>
            </div>
            <div class="payment-code">
                <img src="assets/payment-codes/code2.jpg" alt="支付宝">
                <p>支付宝</p>
            </div>
        </div>

        <div class="note">
            <strong>⚠️ 支付说明：</strong><br>
            1. 扫码支付对应金额<br>
            2. <strong>支付备注填写：商品名 + 你的邮箱</strong><br>
            3. 填写下方表单提交<br>
            4. 系统自动发送下载链接到邮箱
        </div>

        <form id="orderForm" style="margin-top: 30px;">
            <div class="form-group">
                <label>你选择的商品：</label>
                <select id="productSelect" required>
                    <option value="chatgpt">ChatGPT Prompt合集 - ¥29.9</option>
                    <option value="midjourney">Midjourney Prompt合集 - ¥39.9</option>
                    <option value="combo">超级组合套餐 - ¥59.9</option>
                </select>
            </div>

            <div class="form-group">
                <label>你的邮箱：</label>
                <input type="email" id="email" placeholder="example@email.com" required>
            </div>

            <div class="form-group">
                <label>支付方式：</label>
                <select id="paymentMethod" required>
                    <option value="wechat">微信支付</option>
                    <option value="alipay">支付宝</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">✓ 已完成支付，发送下载链接</button>
        </form>

        <div class="success-message" id="successMessage" style="display: none;">
            <h3 style="margin-bottom: 15px;">🎉 支付成功！</h3>
            <div style="background: #d4edda; padding: 20px; border-radius: 10px; margin: 20px 0;">
                <p style="font-size: 18px; margin-bottom: 15px;"><strong>📦 你的商品：</strong></p>
                <p id="purchasedProduct" style="font-size: 16px; margin-bottom: 15px; color: #155724;"></p>
                <a id="downloadLink" href="#" class="submit-btn" style="display: block; text-decoration: none; margin-top: 20px;">
                    📥 立即下载
                </a>
            </div>
            <p style="margin-top: 20px; color: #666; font-size: 14px;">
                💾 链接已同时发送到你的邮箱，请保存以便后续下载<br>
                📧 如未收到邮件，请检查垃圾邮件文件夹
            </p>
        </div>
    </div>

    <script>
        // 产品配置
        const products = {
            'chatgpt': {
                name: 'ChatGPT Prompt合集',
                price: '29.9',
                downloadUrl: 'https://mfgame.github.io/virtual-resource-shop/download.html#chatgpt',
                file: 'ChatGPT-Prompt-合集-v1.0.zip'
            },
            'midjourney': {
                name: 'Midjourney Prompt合集',
                price: '39.9',
                downloadUrl: 'https://mfgame.github.io/virtual-resource-shop/download.html#midjourney',
                file: 'Midjourney-Prompt-合集-v1.0.zip'
            },
            'combo': {
                name: '超级组合套餐',
                price: '59.9',
                downloadUrl: 'https://mfgame.github.io/virtual-resource-shop/download.html',
                file: 'ChatGPT+Midjourney合集'
            }
        };

        // 从URL参数获取商品信息
        const urlParams = new URLSearchParams(window.location.search);
        const product = urlParams.get('product');
        if (product) {
            document.getElementById('productSelect').value = product;
            updateProductInfo();
        }

        function updateProductInfo() {
            const select = document.getElementById('productSelect');
            const info = document.getElementById('productInfo');
            const selectedProduct = products[select.value];
            info.textContent = `${selectedProduct.name} - ¥${selectedProduct.price}`;
        }

        document.getElementById('productSelect').addEventListener('change', updateProductInfo);
        updateProductInfo();

        // 表单提交
        document.getElementById('orderForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const productKey = document.getElementById('productSelect').value;
            const email = document.getElementById('email').value;
            const paymentMethod = document.getElementById('paymentMethod').value;
            const product = products[productKey];

            // 保存订单
            const order = {
                product: productKey,
                productName: product.name,
                price: product.price,
                email: email,
                paymentMethod: paymentMethod,
                timestamp: new Date().toISOString(),
                status: 'completed'
            };

            // 保存到localStorage
            let orders = JSON.parse(localStorage.getItem('orders') || '[]');
            orders.push(order);
            localStorage.setItem('orders', JSON.stringify(orders));

            // 显示下载信息
            document.getElementById('purchasedProduct').textContent = `${product.name} - ¥${product.price}`;
            document.getElementById('downloadLink').href = product.downloadUrl;
            
            document.getElementById('orderForm').style.display = 'none';
            document.getElementById('successMessage').style.display = 'block';

            // 自动跳转到下载页面（5秒后）
            setTimeout(() => {
                window.location.href = product.downloadUrl;
            }, 3000);
        });
    </script>
</body>
</html>
