<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付成功 - AI资源商店</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h2 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }
        .payment-codes {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }
        .payment-code {
            text-align: center;
        }
        .payment-code img {
            width: 200px;
            height: 200px;
            border-radius: 10px;
            border: 2px solid #eee;
        }
        .payment-code p {
            margin-top: 10px;
            font-weight: bold;
            color: #666;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 16px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .submit-btn:hover {
            transform: scale(1.02);
        }
        .note {
            background: #fff3cd;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            color: #856404;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .product-info {
            background: #f0f0ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #667eea;
            font-weight: bold;
            text-align: center;
        }
        .success-message {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>💳 完成支付</h2>

        <div class="product-info" id="productInfo">
            <!-- 动态填充商品信息 -->
        </div>

        <p style="margin-bottom: 20px; color: #666; text-align: center;">
            请使用微信或支付宝扫码支付
        </p>

        <div class="payment-codes">
            <div class="payment-code">
                <img src="assets/payment-codes/code1.jpg" alt="微信支付">
                <p>微信支付</p>
            </div>
            <div class="payment-code">
                <img src="assets/payment-codes/code2.jpg" alt="支付宝">
                <p>支付宝</p>
            </div>
        </div>

        <div class="note">
            <strong>⚠️ 支付说明：</strong><br>
            1. 扫码支付对应金额<br>
            2. <strong>支付备注填写：商品名 + 你的邮箱</strong><br>
            3. 填写下方表单提交<br>
            4. 系统自动发送下载链接到邮箱
        </div>

        <form id="orderForm" style="margin-top: 30px;">
            <div class="form-group">
                <label>你选择的商品：</label>
                <select id="productSelect" required>
                    <option value="chatgpt">ChatGPT Prompt合集 - ¥29.9</option>
                    <option value="midjourney">Midjourney Prompt合集 - ¥39.9</option>
                    <option value="combo">超级组合套餐 - ¥59.9</option>
                </select>
            </div>

            <div class="form-group">
                <label>你的邮箱：</label>
                <input type="email" id="email" placeholder="example@email.com" required>
            </div>

            <div class="form-group">
                <label>支付方式：</label>
                <select id="paymentMethod" required>
                    <option value="wechat">微信支付</option>
                    <option value="alipay">支付宝</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">✓ 已完成支付，发送下载链接</button>
        </form>

        <div class="success-message" id="successMessage">
            <h3 style="margin-bottom: 10px;">✅ 提交成功！</h3>
            <p>下载链接将在5分钟内发送到你的邮箱</p>
            <p style="margin-top: 10px;">如未收到，请检查垃圾邮件或联系客服</p>
        </div>
    </div>

    <script>
        // 从URL参数获取商品信息
        const urlParams = new URLSearchParams(window.location.search);
        const product = urlParams.get('product');
        if (product) {
            document.getElementById('productSelect').value = product;
            updateProductInfo();
        }

        function updateProductInfo() {
            const select = document.getElementById('productSelect');
            const info = document.getElementById('productInfo');
            const prices = {
                'chatgpt': 'ChatGPT Prompt合集 - ¥29.9',
                'midjourney': 'Midjourney Prompt合集 - ¥39.9',
                'combo': '超级组合套餐 - ¥59.9'
            };
            info.textContent = prices[select.value];
        }

        document.getElementById('productSelect').addEventListener('change', updateProductInfo);
        updateProductInfo();

        // 表单提交
        document.getElementById('orderForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const product = document.getElementById('productSelect').value;
            const email = document.getElementById('email').value;
            const paymentMethod = document.getElementById('paymentMethod').value;

            // 保存订单到本地存储
            const order = {
                product: product,
                email: email,
                paymentMethod: paymentMethod,
                timestamp: new Date().toISOString(),
                status: 'pending'
            };

            let orders = JSON.parse(localStorage.getItem('orders') || '[]');
            orders.push(order);
            localStorage.setItem('orders', JSON.stringify(orders));

            // 显示成功消息
            document.getElementById('orderForm').style.display = 'none';
            document.getElementById('successMessage').style.display = 'block';

            // 这里可以调用后端API发送邮件
            // await fetch('/api/send-email', { method: 'POST', body: JSON.stringify(order) });
        });
    </script>
</body>
</html>
