<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script>
        // 重定向到新的支付页面
        const urlParams = new URLSearchParams(window.location.search);
        const product = urlParams.get('product');
        if (product) {
            window.location.href = `../payment-new.html?product=${product}`;
        } else {
            window.location.href = '../payment-new.html';
        }
    </script>
</head>
<body>
    <p>正在跳转...</p>
</body>
</html>
