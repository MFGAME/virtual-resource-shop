<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理系统 - AI资源商店</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 30px;
            font-size: 32px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            transition: transform 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .stat-card h3 {
            font-size: 14px;
            margin-bottom: 12px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stat-card p {
            font-size: 36px;
            font-weight: bold;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        button, .btn {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
        }
        button:hover, .btn:hover {
            background: #5568d6;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .refresh-btn { background: #28a745; }
        .export-btn { background: #17a2b8; }
        .clear-btn { background: #dc3545; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }
        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        tbody tr:hover {
            background: #f8f9fa;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }
        .status-pending {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffc107;
        }
        .status-approved {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }
        .status-rejected {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }
        .action-btn {
            padding: 8px 16px;
            margin: 0 5px;
            font-size: 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        .approve-btn {
            background: #28a745;
            color: white;
        }
        .approve-btn:hover {
            background: #218838;
            transform: scale(1.05);
        }
        .reject-btn {
            background: #dc3545;
            color: white;
        }
        .reject-btn:hover {
            background: #c82333;
            transform: scale(1.05);
        }
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #999;
        }
        .empty-state p:first-child {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .payment-proof {
            max-width: 150px;
            cursor: pointer;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }
        .payment-proof:hover {
            transform: scale(1.1);
            border-color: #667eea;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 18px;
        }
        .order-id {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span>📊</span>
            订单管理系统
        </h1>

        <div class="stats" id="stats">
            <div class="stat-card">
                <h3>总订单数</h3>
                <p id="statTotal">-</p>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);">
                <h3>待审核</h3>
                <p id="statPending">-</p>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #28a745 0%, #20c997 100%);">
                <h3>已通过</h3>
                <p id="statApproved">-</p>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);">
                <h3>已拒绝</h3>
                <p id="statRejected">-</p>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #17a2b8 0%, #138496 100%);">
                <h3>总收入</h3>
                <p id="statRevenue">-</p>
            </div>
        </div>

        <div class="controls">
            <button class="refresh-btn" onclick="refreshOrders()">🔄 刷新</button>
            <button class="export-btn" onclick="exportCSV()">📥 导出CSV</button>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <p>加载中...</p>
        </div>

        <div id="ordersTable">
            <!-- 动态填充 -->
        </div>
    </div>

    <div class="modal" id="imageModal" onclick="this.style.display='none'">
        <img id="modalImage" src="">
    </div>

    <script src="js/api.js"></script>
    <script>
        // 加载订单
        async function loadOrders() {
            const result = await getOrders();
            return result.success ? result.orders : [];
        }

        // 渲染统计
        async function renderStats() {
            const result = await getStats();
            if (result.success) {
                const stats = result.stats;
                document.getElementById('statTotal').textContent = stats.total;
                document.getElementById('statPending').textContent = stats.pending;
                document.getElementById('statApproved').textContent = stats.approved;
                document.getElementById('statRejected').textContent = stats.rejected;
                document.getElementById('statRevenue').textContent = `¥${stats.totalRevenue.toFixed(1)}`;
            }
        }

        // 渲染订单
        async function renderOrders() {
            const orders = await loadOrders();

            if (orders.length === 0) {
                document.getElementById('ordersTable').innerHTML = `
                    <div class="empty-state">
                        <p>📭</p>
                        <p style="font-size: 18px;">暂无订单</p>
                        <p style="margin-top: 10px; font-size: 14px;">等待第一位客户...</p>
                    </div>
                `;
                return;
            }

            const tableHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>订单号</th>
                            <th>商品</th>
                            <th>金额</th>
                            <th>邮箱</th>
                            <th>支付方式</th>
                            <th>支付凭证</th>
                            <th>状态</th>
                            <th>提交时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${orders.map(order => `
                            <tr>
                                <td><span class="order-id">${order.id}</span></td>
                                <td><strong>${order.product}</strong></td>
                                <td>¥${order.price}</td>
                                <td>${order.email}</td>
                                <td>${order.payment_method === 'wechat' ? '💚 微信' : '💙 支付宝'}</td>
                                <td>
                                    ${order.payment_screenshot ?
                                        `<img src="${order.payment_screenshot}" class="payment-proof" onclick="showImage('${order.payment_screenshot}')">`
                                        : '❌ 无'
                                    }
                                </td>
                                <td>
                                    <span class="status-badge status-${order.status}">
                                        ${order.status === 'pending' ? '⏳ 待审核' : order.status === 'approved' ? '✅ 已通过' : '❌ 已拒绝'}
                                    </span>
                                </td>
                                <td>${new Date(order.created_at).toLocaleString('zh-CN')}</td>
                                <td>
                                    ${order.status === 'pending' ?
                                        `<button class="action-btn approve-btn" onclick="approveOrder('${order.id}')">✓ 通过</button>
                                         <button class="action-btn reject-btn" onclick="rejectOrder('${order.id}')">✕ 拒绝</button>`
                                        : '-'
                                    }
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            document.getElementById('ordersTable').innerHTML = tableHTML;
        }

        // 批准订单
        async function approveOrder(orderId) {
            if (!confirm('✅ 确认批准此订单？\n\n系统将自动发送下载链接到客户邮箱。')) return;

            const result = await updateOrderStatus(orderId, 'approved');

            if (result.success) {
                alert('✅ 已批准！\n订单号: ' + orderId);
                refreshOrders();
            } else {
                alert('❌ 操作失败：' + (result.error || '未知错误'));
            }
        }

        // 拒绝订单
        async function rejectOrder(orderId) {
            const reason = prompt('❌ 拒绝原因：');
            if (!reason) return;

            const result = await updateOrderStatus(orderId, 'rejected');

            if (result.success) {
                alert('❌ 已拒绝');
                refreshOrders();
            } else {
                alert('❌ 操作失败');
            }
        }

        // 刷新
        async function refreshOrders() {
            document.getElementById('loading').style.display = 'block';
            await renderStats();
            await renderOrders();
            document.getElementById('loading').style.display = 'none';
        }

        // 导出CSV
        async function exportCSV() {
            const orders = await loadOrders();
            if (orders.length === 0) {
                alert('没有订单数据');
                return;
            }

            const headers = ['订单号', '商品', '金额', '邮箱', '支付方式', '状态', '提交时间'];
            const csv = [
                headers.join(','),
                ...orders.map(o => [
                    o.id,
                    o.product,
                    o.price,
                    o.email,
                    o.payment_method,
                    o.status,
                    new Date(o.created_at).toLocaleString('zh-CN')
                ].join(','))
            ].join('\n');

            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `订单_${new Date().toLocaleDateString()}.csv`;
            a.click();
        }

        // 显示图片
        function showImage(src) {
            document.getElementById('modalImage').src = src;
            document.getElementById('imageModal').style.display = 'flex';
        }

        // 初始化
        refreshOrders();

        // 自动刷新
        setInterval(refreshOrders, 30000);
    </script>
</body>
</html>
